name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never interrupt production promotion. Newer PR checks may replace older ones.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          TEST_PRODUCTION: '1'
      - name: Save production build
        uses: actions/upload-artifact@v4
        with:
          name: aerth-static-build
          path: dist/
          retention-days: 14
      - name: Save browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Publish live site
    needs: verify
    if: >-
      github.repository == 'org-beaconstone/aerth-companion-configurator' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      id-token: write
    # A reusable workflow supplies the signed job_workflow_ref matched by Kaizen.
    uses: ./.github/workflows/deploy.yml
